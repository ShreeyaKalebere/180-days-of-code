name: Daily C++ Challenge

on:
  schedule:
    - cron: "30 3 * * *"   # 09:00 IST - new problem + reminder issue
    - cron: "30 16 * * *"  # 22:00 IST - if not solved yet, add the reference solution
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        type: choice
        options: [morning, evening, backfill]
        default: morning
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-challenge
  cancel-in-progress: false

jobs:
  daily:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Pick mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 3 * * *" ]; then
            echo "mode=morning" >> "$GITHUB_OUTPUT"
          else
            echo "mode=evening" >> "$GITHUB_OUTPUT"
          fi

      - name: Run daily script
        id: run
        run: python3 scripts/daily.py ${{ steps.mode.outputs.mode }}

      - name: Commit and push
        if: steps.run.outputs.changed == 'true'
        run: |
          # Commit as YOU (not github-actions[bot]) so it counts on your contribution graph.
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git add -A daily/
          git commit -m "${{ steps.run.outputs.message }}"
          git push origin HEAD:main

      - name: Close old reminders
        if: steps.mode.outputs.mode != 'backfill'
        run: |
          for n in $(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "Daily reminder in:title" --json number --jq '.[].number'); do
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" --comment "Closed automatically."
          done

      - name: Open today's reminder
        if: steps.mode.outputs.mode == 'morning' && steps.run.outputs.changed == 'true'
        run: |
          DAY=$(printf "%03d" "${{ steps.run.outputs.day }}")
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --assignee "${{ github.repository_owner }}" \
            --title "Daily reminder - Day ${{ steps.run.outputs.day }}: ${{ steps.run.outputs.title }}" \
            --body "Today's problem is ready: [daily/day-$DAY](https://github.com/$GITHUB_REPOSITORY/tree/main/daily/day-$DAY)

          1. \`git pull\`
          2. Solve it in \`daily/day-$DAY/solution.cpp\`
          3. \`git add . && git commit -m \"Day ${{ steps.run.outputs.day }}: solved\" && git push\`

          No time today? Don't worry - at 10 PM IST a reference solution is added automatically so your streak continues."

  test:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and test every solution
        run: python3 scripts/daily.py test
